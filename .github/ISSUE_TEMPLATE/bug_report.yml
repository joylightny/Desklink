name: Bug report
description: Report a reproducible DeskBlink problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve DeskBlink. Do not include a complete license key or private information.
  - type: input
    id: version
    attributes:
      label: DeskBlink version
      placeholder: e.g. 1.0.0
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: e.g. macOS 15.1
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Mac and display setup
      placeholder: e.g. MacBook Air M3 with one external display
    validations:
      required: true
  - type: dropdown
    id: trigger
    attributes:
      label: Trigger used
      options: [Keyboard shortcut, Trackpad gesture, Mouse button, Settings interface, Other]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Describe what happened and what you expected.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Additional context
      description: Add sanitized screenshots or other relevant details.
